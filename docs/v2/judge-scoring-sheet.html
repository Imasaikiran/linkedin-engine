<title>Judge scoring sheet</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 16px/1.55 -apple-system, system-ui, sans-serif; max-width: 760px; margin: 2rem auto; padding: 0 1rem; }
  h1 { font-size: 1.5rem; }
  .muted { color: #888; }
  .card { border: 1px solid #ccc4; border-radius: 12px; padding: 1rem 1.25rem; margin: 1rem 0; }
  .post { white-space: pre-wrap; background: #8881; border-radius: 8px; padding: .75rem; margin: .5rem 0; }
  .scores { display: flex; gap: .4rem; flex-wrap: wrap; }
  .scores label { border: 1px solid #ccc8; border-radius: 8px; padding: .3rem .7rem; cursor: pointer; }
  .scores input { margin-right: .3rem; }
  button { font: inherit; padding: .6rem 1.2rem; border-radius: 10px; border: 0; background: #2563eb; color: #fff; cursor: pointer; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .reveal { margin-top: .6rem; padding: .6rem .75rem; border-radius: 8px; background: #8881; display: none; }
  .verdict { font-size: 1.2rem; font-weight: 700; padding: 1rem; border-radius: 12px; margin-top: 1rem; }
  .pass { background: #16a34a22; } .fail { background: #dc262622; }
  table { border-collapse: collapse; width: 100%; margin-top: .5rem; }
  th, td { border: 1px solid #ccc6; padding: .4rem .6rem; text-align: left; font-size: .92rem; }

<body>
<h1>Judge scoring sheet</h1>
<p class="muted">Score each draft 1 to 5 on voice fidelity and quality, the same scale the judge uses
(5 = your best work, 1 = generic slop). The judge's scores are hidden until you submit.
The set mixes your real posts with deliberate slop, shuffled. Threshold for blocking: <b>3</b>.</p>

<form id="sheet"></form>
<button id="reveal" disabled>Reveal judge scores and verdict</button>
<div id="results"></div>

<script>
const ITEMS = [{"id":"Draft A","source":"slop:4","text":"Leadership is not about titles.\n\nAs a thought leader in the space, I've seen it all.\n\nTrue leaders empower their teams to reach their full potential and drive impactful outcomes at scale.\n\nIt's all about the journey, not the destination.\n\nWhat does leadership mean to you?","judge":1,"reason":"Generic motivational platitudes with zero specificity, no concrete claim, no source-grounded argument, and a vague engagement-bait question — the opposite of the author's sharp, evidence-driven, debatable voice."},{"id":"Draft B","source":"slop:1","text":"🚀 Thrilled to share some exciting news!\n\nIn today's fast-paced world, AI is a game-changer revolutionizing every industry.\n\nI'm passionate about leveraging cutting-edge synergies to unlock value across the ecosystem.\n\nLet's dive deep and unpack how we can all win together. 💡\n\nThe future is here. Are you ready?\n\n#AI #Innovation #Leadership #Growth","judge":1,"reason":"Pure generic AI buzzword slop with zero analytical content, no specific claim, no contrarian angle, and none of the author's signature structure of named frameworks, concrete examples, or closing debate questions."},{"id":"Draft C","source":"golden:2026-W19-fri.md","text":"---\nweek: 2026-W19\nday: fri\npillar: critique\ncost_usd: 0.017409\nretries: 0\nword_count: 240\nchar_count: 1485\n---\n\nAnthropic and OpenAI's forward-deployed engineer bets may be a trap\n\nThe common read is that embedding engineers directly into mid-market companies is how frontier labs finally crack enterprise adoption at scale.\n\nWhat that read misses: Anthropic's $1.5B joint venture with Blackstone, Goldman Sachs, and Hellman & Friedman, and OpenAI's parallel $4B venture with TPG, Bain, and Brookfield, both depend on a labor model that does not compound. You are not building a product flywheel. You are staffing a consulting practice with a Claude logo on it.\n\nForward-deployed engineers generate revenue and generate insight. But the insight stays trapped in bespoke workflows inside portfolio companies. It rarely feeds back into the model or the platform in ways that widen the moat. What you get is a high-touch, high-cost engagement that looks like SaaS ARR on a pitch deck but behaves like professional services on a P&L.\n\nI watched a mid-market rollout take 14 months to reach steady state because every edge case required an engineer on a call. That is not a distribution strategy. That is an account management problem with better branding.\n\nThe charitable version of this bet: both labs are buying ground truth data on how real companies actually work, and that corpus will eventually train something worth the price. That would make the services layer a research investment, not a revenue model.\n\nI am genuinely uncertain which version is true. Are you building a moat or renting one?\n","judge":5,"reason":"The draft matches the author's signature structure exactly—common read, sharp reframe, concrete evidence, charitable counterpoint, and a closing question—with the same clipped declarative rhythm and willingness to sit in genuine uncertainty."},{"id":"Draft D","source":"golden:2026-W17-fri.md","text":"---\nweek: 2026-W17\nday: fri\npillar: critique\ncost_usd: 0.019482\nretries: 0\nword_count: 261\nchar_count: 1680\n---\n\nAnthropic's Claude Mythos launch got the safety logic backwards\n\nMost people read Project Glasswing as responsible stewardship. Restrict a powerful cybersecurity model to 40 organizations, keep it out of bad hands, protect the internet. That framing is everywhere right now.\n\nWhat it misses: attackers do not apply to waitlists. They share tools in private channels, iterate fast, and do not wait for a press release. Defenders, on the other hand, are exactly the kind of institutions that go through formal access programs. So a 40-org cap on Claude Mythos does not symmetrically slow both sides. It slows the side that follows rules.\n\nOpenAI read this differently. GPT-5.4-Cyber went to thousands of defenders. Broad distribution to the people actively patching networks, triaging alerts, and writing detection rules. I watched security teams I know go from months-long vulnerability reviews to findings in seconds after getting access. That asymmetry matters more than the headline restriction numbers.\n\nTo be fair to Anthropic, I think the Glasswing model reflects a genuine belief that concentrated, auditable deployment produces better feedback and fewer catastrophic misuses early on. With Anthropic capturing 37 percent of enterprise AI spending right now, they have real use to set norms, and they are betting that quality of deployment beats quantity.\n\nBut I think they are solving for the wrong tail risk. The catastrophic scenario is not a vetted defender misusing Mythos. It is defenders being outpaced because access was rationed.\n\nDo you think restricted rollouts protect more than they cost, or is broad defender access the only move that actually shifts the odds?\n","judge":5,"reason":"The draft matches the author's voice precisely: a named fictional product, a clear contrarian reframe stated early, a steelman of the opposing view, concrete asymmetry logic, and a sharp closing question—all at the same cadence and word-count register as the best critique exemplars."},{"id":"Draft E","source":"golden:2026-W17-mon.md","text":"---\nweek: 2026-W17\nday: mon\npillar: shipped\ncost_usd: 0.013704\nretries: 0\nword_count: 235\nchar_count: 1377\n---\n\nWe hardcoded Claude into our stack and paid for it 3 times\n\nLast year, our team built a document-processing feature directly around Claude Sonnet. Not an abstraction layer. The model name was literally in our config files, our prompt templates, our error messages.\n\nIt felt fast. It was fast. We shipped in two weeks and the feature worked beautifully.\n\nThen Claude Sonnet 4.6 dropped. Then GPT-5.4. Then Gemini 3.1 and Grok 4.20, all within weeks of each other. Suddenly our competitors were testing newer models while we were stuck in a refactor that ate an entire sprint.\n\nThe tradeoff we missed was not about the models themselves. It was about the assumption baked into our architecture: that the model we chose at launch would stay the best choice. That assumption has a shelf life measured in months, maybe weeks now.\n\nWhat we should have built was a routing layer with a named interface, something like ModelClient, that swapped providers without touching business logic. We knew this pattern existed. We skipped it because the deadline felt more real than the future technical debt.\n\nThe lesson I carried forward: every time you write a model name directly into product code, you are making a bet that the frontier stays still. Right now, that bet loses almost every quarter.\n\nIs your team building for the model you have, or the one you will need six months from now?\n","judge":4,"reason":"The draft matches the author's concrete-lesson structure, first-person accountability, and closing question, but the fictional version numbers (GPT-5.4, Grok 4.20) and slightly softer prose rhythm keep it just below the sharpest exemplars."},{"id":"Draft F","source":"golden:2026-W18-mon.md","text":"---\nweek: 2026-W18\nday: mon\npillar: shipped\ncost_usd: 0.014901\nretries: 0\nword_count: 207\nchar_count: 1242\n---\n\n4M weekly users didn't come from a better autocomplete\n\nOpenAI Codex crossed that number after one product decision that most teams would have delayed: shipping persistent goals.\n\nThe team behind Codex chose to let the agent hold a task in memory across a full coding session, not just a single prompt. That meant building a permission profile so Codex could run terminal commands, read file trees, and write diffs without asking for confirmation every step. The tradeoff was real. More autonomy meant more surface area for the agent to do something unexpected. They shipped it anyway, pairing the persistent-goal architecture with a sandboxed environment so the blast radius stayed small.\n\nThe lesson I kept turning over: activation in agentic tools is not about the first output. It is about whether the user trusts the agent enough to hand it a second task. Persistent goals changed that calculus. A developer who watched Codex finish a multi-file refactor without interruption came back. One who had to babysit every step did not.\n\nThe sharp question for any PM building in this space: what is the smallest unit of autonomy your users will trust on day one, and does your permission model actually protect them if the agent gets it wrong?\n","judge":5,"reason":"The draft matches the author's 'shipped' pillar voice precisely—concrete mechanism first, clean causal logic, a named tradeoff, and a sharp closing question directed at practitioners—indistinguishable from exemplars like the hardcoded-Claude and routing-layer posts."},{"id":"Draft G","source":"golden:2026-W23-wed.md","text":"---\nweek: 2026-W23\nday: wed\npillar: framework\nretries: 0\nword_count: 245\nchar_count: 1460\ntrace_url: \"\"\n---\n\nStop writing PRDs. Start engineering context\n\nAI PMs at frontier labs are discovering that the PRD is no longer the primary artifact. Persistent context engineering is. Synthetic evals are collapsing feedback loops from weeks to hours, and the teams moving fastest are the ones who have a repeatable stack for it.\n\nI mapped this into a framework I now use every sprint. I call it the Context Engineering Stack.\n\n1. Signal Layer\nCapture the inputs your model will actually see. Raw prompts, retrieved chunks, tool outputs. If you cannot read it, your model cannot reason from it.\n\n2. Eval Layer\nWrite synthetic evaluation tests before you write features. This alone cut our hallucination risk by 80% on one recent production rollout. Validation is now a design step, not a QA step.\n\n3. Memory Layer\nDecide what persists across sessions and what resets. Agentic workflows break without explicit memory contracts. Document them the way you used to document API schemas.\n\n4. Routing Layer\nMap which tasks go to deterministic logic and which go to probabilistic inference. Mixing them without a clear boundary is where most AI products quietly fail.\n\n5. Feedback Layer\nClose the loop in hours, not sprints. Synthetic evals give you a signal before real users ever touch the feature.\n\nThe PRD told engineers what to build. The Context Engineering Stack tells your model how to think.\n\nSave this. Share it with one AI PM on your team. What step is your team skipping?\n","judge":4,"reason":"The voice, structure, and cadence closely match the author's framework posts—numbered layers, a sharp reframe, a concrete claim with a stat, and a closing question—but the '80% hallucination reduction' feels like a placeholder metric rather than a lived anecdote, and the opening pivot ('Stop X. Start Y') echoes exemplar 6 too closely to feel fully original."},{"id":"Draft H","source":"slop:3","text":"Most people will never succeed.\n\nHere's the thing: while you're sleeping, someone else is grinding.\n\nI woke up at 4am today. Did you?\n\nSuccess isn't given. It's taken.\n\nStop making excuses and start making moves.\n\nAgree?","judge":1,"reason":"Generic hustle-culture motivational slop with zero analytical substance, no specific claim, no source, no framework, and no resemblance to the author's evidence-driven, contrarian, technically grounded voice."},{"id":"Draft I","source":"slop:2","text":"5 lessons I learned this week 👇\n\n1. Always believe in yourself\n2. Hard work beats talent\n3. Surround yourself with great people\n4. Never give up on your dreams\n5. Consistency is key\n\nWhich one resonates most?\n\nLet that sink in.\n\n#Motivation #Success","judge":1,"reason":"Generic motivational listicle with zero technical substance, no specific claim to challenge, no author voice, and hashtag-driven engagement bait that is the exact opposite of the author's evidence-based, opinionated, AI-focused style."},{"id":"Draft J","source":"golden:2026-W19-wed.md","text":"---\nweek: 2026-W19\nday: wed\npillar: framework\ncost_usd: 0.013275\nretries: 0\nword_count: 187\nchar_count: 1176\n---\n\n3 reasons synthetic evals beat human review for agentic AI\n\nHuman review pipelines break down fast when agents branch across 10+ tools and memory states. I built a synthetic eval framework last quarter that cut hallucination rates by 80% across a production agent suite, and the pattern is repeatable.\n\n1. Deterministic acceptance criteria\nHuman reviewers disagree on edge cases. Synthetic evals encode exact pass/fail conditions once, then run them thousands of times without drift.\n\n2. Coverage at agent-branching scale\nA single agentic workflow can fork into hundreds of execution paths. Human review samples maybe 5% of those. Synthetic evals cover all of them, every run.\n\n3. Feedback loops that close in minutes, not days\nWhen I integrated synthetic evals into a CI pipeline for an OpenAI Frontier-style deployment, regressions surfaced in under 4 minutes. Human review cycles were taking 3 days for the same signal.\n\nI call this the Synthetic Acceptance Criteria (SAC) framework. Save this post and drop it into your next eval planning doc. If you run agents at Anthropic, OpenAI, or DeepMind, I'd genuinely like to hear how your team handles acceptance criteria today.\n","judge":4,"reason":"The numbered framework structure, first-person build evidence, and closing question match the author's voice closely, but the explicit name-dropping of Anthropic/OpenAI/DeepMind as a reach-out tactic and the 'save this post' prompt feel slightly more performative than the author's typically sharper, more restrained endings."}];
const THRESHOLD = 3;
const form = document.getElementById('sheet');

ITEMS.forEach((it, idx) => {
  const card = document.createElement('div');
  card.className = 'card';
  const scores = [1,2,3,4,5].map(v =>
    '<label><input type="radio" name="s'+idx+'" value="'+v+'">'+v+'</label>').join('');
  card.innerHTML = '<b>'+it.id+'</b>'
    + '<div class="post">'+escapeHtml(it.text)+'</div>'
    + '<div class="scores">'+scores+'</div>';
  form.appendChild(card);
});

function escapeHtml(s){return s.replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function allAnswered(){return ITEMS.every((_,i)=>form.querySelector('input[name="s'+i+'"]:checked'));}
form.addEventListener('change', ()=>{ document.getElementById('reveal').disabled = !allAnswered(); });

document.getElementById('reveal').addEventListener('click', ()=>{
  const human = ITEMS.map((_,i)=>Number(form.querySelector('input[name="s'+i+'"]:checked').value));
  const judge = ITEMS.map(it=>it.judge);
  const deltas = human.map((h,i)=>Math.abs(h-judge[i]));
  const within1 = deltas.filter(d=>d<=1).length/deltas.length;
  const sorted = [...deltas].sort((a,b)=>a-b);
  const median = sorted.length%2 ? sorted[(sorted.length-1)/2] : (sorted[sorted.length/2-1]+sorted[sorted.length/2])/2;
  const mae = deltas.reduce((a,b)=>a+b,0)/deltas.length;
  const rho = spearman(human, judge);

  let rows = '<table><tr><th>Draft</th><th>You</th><th>Judge</th><th>Δ</th><th>What it was</th></tr>';
  ITEMS.forEach((it,i)=>{
    const cls = deltas[i]<=1 ? 'delta-ok' : 'delta-bad';
    rows += '<tr><td>'+it.id+'</td><td>'+human[i]+'</td><td>'+judge[i]+'</td>'
      + '<td class="'+cls+'">'+deltas[i]+'</td><td>'+it.source+'</td></tr>';
  });
  rows += '</table>';

  const pass = median < 1 && within1 >= 0.8 && rho >= 0.6;
  const verdict = pass
    ? 'PASS — the judge tracks your taste. Median disagreement '+median+' (< 1), within-1 agreement '+(within1*100).toFixed(0)+'%, Spearman '+rho.toFixed(2)+'. The blocking gate is trustworthy.'
    : 'NEEDS TUNING — median disagreement '+median+', within-1 '+(within1*100).toFixed(0)+'%, Spearman '+rho.toFixed(2)+'. Adjust the judge prompt or threshold, or grow the golden corpus, then re-run.';

  document.getElementById('results').innerHTML =
    rows + '<div class="verdict '+(pass?'pass':'fail')+'">'+verdict+'</div>'
    + '<p class="muted">Judge reasons:</p><ul>'
    + ITEMS.map((it,i)=>'<li><b>'+it.id+'</b> ('+it.source+'): '+escapeHtml(it.reason)+'</li>').join('')
    + '</ul>';
  document.getElementById('reveal').disabled = true;
  document.getElementById('results').scrollIntoView({behavior:'smooth'});
});

// Spearman rank correlation.
function spearman(a, b){
  const rank = arr => {
    const idx = arr.map((v,i)=>[v,i]).sort((x,y)=>x[0]-y[0]);
    const r = new Array(arr.length);
    let i=0;
    while(i<idx.length){
      let j=i; while(j+1<idx.length && idx[j+1][0]===idx[i][0]) j++;
      const avg=(i+j)/2+1;
      for(let k=i;k<=j;k++) r[idx[k][1]]=avg;
      i=j+1;
    }
    return r;
  };
  const ra=rank(a), rb=rank(b), n=a.length;
  const mean=x=>x.reduce((p,c)=>p+c,0)/n;
  const ma=mean(ra), mb=mean(rb);
  let num=0,da=0,db=0;
  for(let i=0;i<n;i++){const x=ra[i]-ma,y=rb[i]-mb;num+=x*y;da+=x*x;db+=y*y;}
  return da&&db ? num/Math.sqrt(da*db) : 0;
}
</script>
