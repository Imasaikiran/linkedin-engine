name: Bug report
description: A run did something wrong
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Include the Langfuse trace URL if you have one.
    validations:
      required: true
  - type: input
    id: profile
    attributes:
      label: Profile
      placeholder: examples/sai-voice
  - type: textarea
    id: expected
    attributes:
      label: What you expected
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      render: shell
