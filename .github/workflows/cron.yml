name: cron

on:
  schedule:
    - cron: '30 0 * * 0'   # Sun 00:30 UTC = 06:00 IST
    - cron: '30 0 * * 3'   # Wed 00:30 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: run pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          LANGFUSE_HOST: ${{ secrets.LANGFUSE_HOST }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
          USER_AGENT: linkedin-engine/0.1 (+github.com/${{ github.repository }})
        run: pnpm pipeline --profile examples/sai-voice
      # Cost is capped in the engine (budgets.cost_usd_per_run, mid-run abort) and
      # run stats land in Supabase, so there is no data/runs summary to assert here.
      - name: commit drafts
        if: always()
        run: |
          git config user.name "linkedin-engine-bot"
          git config user.email "bot@users.noreply.github.com"
          git add drafts/ posted/ || true
          git diff --cached --quiet || git commit -m "chore: weekly pipeline run [skip ci]"
          git push
      - name: upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-logs
          path: logs/
          retention-days: 7
          if-no-files-found: ignore
      - name: write step summary
        if: always()
        run: |
          echo "## Pipeline run" >> $GITHUB_STEP_SUMMARY
          WEEK=$(ls -dt drafts/*/ 2>/dev/null | head -1)
          if [ -n "$WEEK" ]; then
            echo "Latest: \`$WEEK\`" >> $GITHUB_STEP_SUMMARY
            ls "$WEEK" >> $GITHUB_STEP_SUMMARY || true
          else
            echo "_No drafts produced._" >> $GITHUB_STEP_SUMMARY
          fi
      - name: open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: `pipeline failed ${new Date().toISOString().slice(0,10)}`,
              body: `Run: ${context.runId}\nLogs: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
