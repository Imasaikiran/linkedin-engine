name: ci
on:
  push:
    branches: [main, v2-langgraph]
  pull_request:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r run typecheck
      - run: pnpm -r test
      # Builds the dashboard (no secrets needed; it renders an empty state when
      # Supabase env is absent). Catches dashboard breakage before deploy.
      - run: pnpm --filter @linkedin-engine/dashboard build
